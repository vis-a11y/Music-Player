<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div class="player">
        <h2>Music Player</h2>
        <div class="cover">
    <img
        src="https://picsum.photos/400"
        alt="Album Cover"
        id="cover-image"
    >
</div>
        <div class="song-info">
            <h3 id="title">Song Title</h3>
            <p id="artist"></p>
        </div>

        <audio id="audio"></audio>
        <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>
        <div class="slider-container"><input type="range" id="progress" value="0" min="0" max="100"></div>
        

        <div class="controls">
             <button id="prev"><i class="fa-solid fa-angles-left"></i></button>
            <button id="play"><i class="fa-solid fa-play"></i></button>
            <button id="next"><i class="fa-solid fa-angles-right"></i></button>
        </div>

        <div class="volume-selection">
            <label >🔊</label>
            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.1"
                value="1"
            >
            
        </div>
        <h4>Playlist</h4>
            <ul id="playlist"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
